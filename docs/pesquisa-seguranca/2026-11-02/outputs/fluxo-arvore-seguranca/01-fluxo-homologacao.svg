<text x="90" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="#172E47" dominant-baseline="text-before-edge">Da configuração do carro ao CAT</text>
<text x="90" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">Fluxo proposto para leigos, organizado a partir das dez guias observadas no SISCAT.</text>
