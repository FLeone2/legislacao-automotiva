<rect x="100" y="310" width="700" height="330" rx="24" fill="#FFFFFF"/>
<circle cx="154" cy="362" r="26" fill="#087F88"/>
<text x="146" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">1</text>
<text x="204" y="347" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#087F88" dominant-baseline="text-before-edge">PERFIL</text>
<text x="134" y="415" font-family="Segoe UI, Arial, sans-serif" font-size="37" font-weight="700" fill="#172E47" dominant-baseline="text-before-edge">Caracterizar o veículo</text>
<text x="134" y="481" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">Categoria, massas, propulsão, datas,</text>
<text x="134" y="517" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">configurações e equipamentos instalados.</text>
<rect x="950" y="310" width="700" height="330" rx="24" fill="#FFFFFF"/>
<circle cx="1004" cy="362" r="26" fill="#087F88"/>
<text x="996" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">2</text>
<text x="1054" y="347" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#087F88" dominant-baseline="text-before-edge">REGRAS</text>
<text x="984" y="415" font-family="Segoe UI, Arial, sans-serif" font-size="37" font-weight="700" fill="#172E47" dominant-baseline="text-before-edge">Avaliar a aplicabilidade</text>
<text x="984" y="481" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">Ato, artigo, vigência, prazos e exceções.</text>
<text x="984" y="517" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">Aplica / não aplica / falta dado / revisão.</text>
<rect x="1800" y="310" width="700" height="330" rx="24" fill="#FFFFFF"/>
<circle cx="1854" cy="362" r="26" fill="#087F88"/>
<text x="1846" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">3</text>
<text x="1904" y="347" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#087F88" dominant-baseline="text-before-edge">CONSULTA</text>
<text x="1834" y="415" font-family="Segoe UI, Arial, sans-serif" font-size="37" font-weight="700" fill="#172E47" dominant-baseline="text-before-edge">Entender requisito e componente</text>
<text x="1834" y="481" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">Explicação leiga e fonte oficial.</text>
<text x="1834" y="517" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">Peça no 3D e sistemas relacionados.</text>
<rect x="1800" y="780" width="700" height="330" rx="24" fill="#FFFFFF"/>
<circle cx="1854" cy="832" r="26" fill="#087F88"/>
<text x="1846" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">4</text>
<text x="1904" y="817" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#087F88" dominant-baseline="text-before-edge">PLANO</text>
<text x="1834" y="885" font-family="Segoe UI, Arial, sans-serif" font-size="37" font-weight="700" fill="#172E47" dominant-baseline="text-before-edge">Planejar a comprovação</text>
<text x="1834" y="951" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">Documento ou ensaio, método, edição,</text>
<text x="1834" y="987" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">amostra e configuração coberta.</text>
<rect x="950" y="780" width="700" height="330" rx="24" fill="#FFFFFF"/>
<circle cx="1004" cy="832" r="26" fill="#087F88"/>
<text x="996" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">5</text>
<text x="1054" y="817" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#087F88" dominant-baseline="text-before-edge">EVIDÊNCIAS</text>
<text x="984" y="885" font-family="Segoe UI, Arial, sans-serif" font-size="37" font-weight="700" fill="#172E47" dominant-baseline="text-before-edge">Obter e revisar evidências</text>
<text x="984" y="951" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">Laboratório, resultado e cobertura.</text>
<text x="984" y="987" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">Se insuficiente, rever o plano.</text>
<rect x="100" y="780" width="700" height="330" rx="24" fill="#FFFFFF"/>
<circle cx="154" cy="832" r="26" fill="#087F88"/>
<text x="146" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">6</text>
<text x="204" y="817" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#087F88" dominant-baseline="text-before-edge">DOSSIÊ</text>
<text x="134" y="885" font-family="Segoe UI, Arial, sans-serif" font-size="37" font-weight="700" fill="#172E47" dominant-baseline="text-before-edge">Montar documentos e declarações</text>
<text x="134" y="951" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">Distribuir nas dez guias do SISCAT.</text>
<text x="134" y="987" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">Conferir assinaturas e ENSV.</text>
<rect x="100" y="1250" width="700" height="330" rx="24" fill="#FFFFFF"/>
<circle cx="154" cy="1302" r="26" fill="#087F88"/>
<text x="146" y="1282" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">7</text>
<text x="204" y="1287" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#087F88" dominant-baseline="text-before-edge">ANÁLISE</text>
<text x="134" y="1355" font-family="Segoe UI, Arial, sans-serif" font-size="37" font-weight="700" fill="#172E47" dominant-baseline="text-before-edge">Tratar exigências do processo</text>
<text x="134" y="1421" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">Submeter no fluxo autorizado.</text>
<text x="134" y="1457" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">Se houver exigência, revisar o dossiê.</text>
<rect x="950" y="1250" width="700" height="330" rx="24" fill="#FFFFFF"/>
<circle cx="1004" cy="1302" r="26" fill="#087F88"/>
<text x="996" y="1282" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">8</text>
<text x="1054" y="1287" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#087F88" dominant-baseline="text-before-edge">DEFERIMENTO</text>
<text x="984" y="1355" font-family="Segoe UI, Arial, sans-serif" font-size="37" font-weight="700" fill="#172E47" dominant-baseline="text-before-edge">CAT e requisitos posteriores</text>
<text x="984" y="1421" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">Registrar o deferimento.</text>
<text x="984" y="1457" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">Manter obrigações de uso e comercialização.</text>
<rect x="1800" y="1250" width="700" height="330" rx="24" fill="#FFF1DA"/>
<text x="1834" y="1283" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#9A5B0B" dominant-baseline="text-before-edge">VALIDAÇÃO AINDA ABERTA</text>
<text x="1834" y="1332" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="600" fill="#172E47" dominant-baseline="text-before-edge">Direção, assentos e mangueiras;</text>
<text x="1834" y="1372" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="600" fill="#172E47" dominant-baseline="text-before-edge">atos complementares e atualidade.</text>
<text x="1834" y="1450" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">Métodos executáveis e vínculo às malhas</text>
<text x="1834" y="1485" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">3D serão validados em suas etapas.</text>
<rect x="100" y="1645" width="2400" height="90" rx="18" fill="#E6F4F3"/>
<text x="132" y="1667" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#172E47" dominant-baseline="text-before-edge">Consulta textual disponível em todo o percurso. O 3D ajuda a localizar; a conformidade depende da regra e da evidência.</text>
<polyline points="90,1770 2510,1770" fill="none" stroke="#CCD6E1" stroke-width="2" stroke-linejoin="round"/>
<text x="90" y="1792" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#53667B" dominant-baseline="text-before-edge">Base: captura SISCAT e inventário de segurança de 31/10/2026. Proposta funcional; submissão e análise não foram exercitadas.</text>
