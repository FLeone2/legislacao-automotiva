name: tmp-format
on:
  push:
    branches: [feat/ia-busca-web]
    paths: ['.github/workflows/tmp-format.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npx prettier --write functions src tests/ask-function.test.cjs
      - run: npm run build
      - name: Commit and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/tmp-format.yml
          git add -A functions src tests dist assets
          git commit -m "Formatação automática e remoção do fluxo temporário" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01ByDGyJ3RUSEwoPfK7ftJcg"
          git push
