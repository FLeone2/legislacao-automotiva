name: tmp-recapture
on:
  push:
    branches: [feat/ia-pdfs-visual-simples]
    paths: ['.github/workflows/tmp-recapture.yml']
permissions:
  contents: write
jobs:
  recapture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/capture_model_thumbnails.py
      - run: python scripts/capture_reference_boards.py
      - run: python scripts/capture_model_thumbnails.py --check
      - name: Commit regenerated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/suv
          git commit -m "Recaptura as miniaturas e vistas 3D com o motor corrigido" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01ByDGyJ3RUSEwoPfK7ftJcg" || echo "nothing to commit"
          git push
