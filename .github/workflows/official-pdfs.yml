name: Official PDF copies
on:
  workflow_dispatch:
    inputs:
      only:
        description: IDs de atos separados por espaço (vazio = todos)
        required: false
        type: string
  schedule:
    - cron: '41 10 3 * *'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: official-pdfs
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            scripts/requirements-contran.txt
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt pypdf==5.4.0
      - run: python -m playwright install --with-deps chromium
      - name: Copy official documents
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if test -n "$ONLY"; then
            python scripts/fetch_official_pdfs.py --only $ONLY
          else
            python scripts/fetch_official_pdfs.py
          fi
      - name: Rebuild assistant index and published artifact
        run: |
          python scripts/build_ai_index.py
          npm run build
      - name: Open a pull request for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"; then
            echo "Nenhuma cópia nova." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="auto/pdfs-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add pdfs data/ai dist
          git commit -m "Atualiza cópias dos PDFs oficiais"
          git push origin "$branch"
          summary="$(python -c "import json; m=json.load(open('pdfs/manifest.json')); print(f\"{len(m['items'])} cópias; {len(m['failures'])} falhas nesta execução.\")")"
          gh pr create --base "${{ github.ref_name }}" --head "$branch" \
            --title "Atualiza cópias dos PDFs oficiais" \
            --body "$summary Cópias de consulta: não alteram situação jurídica, revisão ou aplicabilidade. Revise o manifesto em pdfs/manifest.json antes de aceitar." \
            || echo "Branch $branch enviada. Se o PR não abriu, permita que o GitHub Actions crie PRs em Settings > Actions > General." >> "$GITHUB_STEP_SUMMARY"
