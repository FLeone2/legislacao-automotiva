name: tmp-probe
on:
  push:
    branches: [tmp-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Ask the production site
        run: |
          cat > probe.py <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright
          QS = ["TPMS é requisito do MOVER?", "Quem emite a LCVM?"]
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  pg = await b.new_page()
                  bodies = []
                  async def on_resp(r):
                      if r.url.endswith('/api/ask') and r.request.method == 'POST':
                          try: bodies.append((r.status, await r.text()))
                          except Exception as e: bodies.append((r.status, str(e)))
                  pg.on('response', lambda r: asyncio.ensure_future(on_resp(r)))
                  for q in QS:
                      bodies.clear()
                      await pg.goto('https://legislacao-automotiva.pages.dev/#ia?q=' + q.replace(' ', '%20'))
                      await pg.wait_for_selector('.ask-answer, .ask-error', timeout=60000)
                      await pg.wait_for_timeout(1500)
                      meta = await pg.locator('.ask-meta-line').first.inner_text()
                      txt = await pg.locator('#askAnswer').inner_text()
                      print('::warning title=Q::' + q)
                      print('::warning title=META::' + meta.replace('\n', ' | '))
                      print('::warning title=SCREEN::' + txt.replace('\n', ' | ')[:900])
                      for st, body in bodies:
                          try:
                              d = json.loads(body)
                              d.pop('usage', None)
                              if d.get('web'): d['web'].pop('suggestions', None)
                              body = json.dumps(d, ensure_ascii=False)
                          except Exception: pass
                          print(f'::warning title=API {st}::' + body.replace('\n', ' ')[:900])
                  await b.close()
          asyncio.run(main())
          PY
          python probe.py
