name: tmp-diag
on:
  push:
    branches: [feat/ia-pdfs-visual-simples]
    paths: ['.github/workflows/tmp-diag.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser tests one by one
        run: |
          python -m http.server 8799 >/dev/null 2>&1 &
          sleep 2
          export VEHICLE_TEST_URL=http://127.0.0.1:8799/
          for f in tests/*-browser.py; do
            n=$(basename $f)
            [ "$n" = accessibility-browser.py ] && continue
            if ! timeout 300 python $f > log.txt 2>&1; then
              echo "::error title=FAIL $n::$(grep -vE '^\s*(\^|~|File|\.\.\.)' log.txt | tail -6 | tr '\n' ' ' | cut -c1-900)"
              grep -n "File \"/home/runner/work.*tests/" log.txt | tail -2 | while read -r l; do echo "::warning title=at $n::$l"; done
            fi
          done
