name: tmp-rebuild
on:
  push:
    branches: [feat/ia-pdfs-visual-simples]
    paths: ['.github/workflows/tmp-rebuild.yml']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run build
      - run: npx prettier --write 'assets/guide/guide.js' 'src/**/*.js' 'dist/**/*.js' || true
      - run: npm run build
      - name: Commit rebuilt bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets dist
          git commit -m "Recompila o 3D com as miniaturas atualizadas" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01ByDGyJ3RUSEwoPfK7ftJcg" || echo "nothing to commit"
          git push
