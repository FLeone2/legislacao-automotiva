# Parâmetros do projeto RB-30 + PEM.
#
# Campos obrigatórios em cada parâmetro (o teste testes/test_parametros.py cobra):
#   valor, unidade (texto que o pint entende), fonte, tag, condicao.
# Tags: M medido, DF datasheet/manual, L literatura, C calculado, E estimativa,
#       H hipótese, ? pendente.
# verificado_no_pdf: true só depois que a página foi lida no PDF original.
#
# Fontes do veículo (lidas na íntegra em 24/10/2026):
#   MAN = Manual de instruções Veículo Elétrico RB, MP-0379, ed. 03/2011, cód. 1190408, 72 p.
#         Numeração impressa = numeração do PDF.
#   CAT = Catálogo de peças RB30-S4 PLUS, cód. 1185669, recorte das pp. 44 a 83 (40 p. no PDF).
#         Cita-se a página IMPRESSA; página do PDF = impressa − 43.
# Diferenças em relação ao enunciado: fontes/RB30_indice.md, seção "Conferência".

