# Parâmetros do projeto RB-30 + PEM.
#
# Campos obrigatórios em cada parâmetro (o teste testes/test_parametros.py cobra):
#   valor, unidade (texto que o pint entende), fonte, tag, condicao.
# Tags: M medido, DF datasheet/manual, L literatura, C calculado, E estimativa,
#       H hipótese, ? pendente.
# verificado_no_pdf: true só depois que a página foi lida no PDF original.
#
# ATENÇÃO (23/10/2026): os PDFs do manual RB-30 (1190408) e do catálogo RB30-S4 PLUS
# (1185669) NÃO estão no repositório nem no Google Drive do pesquisador. Os dados do
# veículo abaixo foram transcritos do enunciado do pesquisador, com a página que ele
# indicou, e ficam com verificado_no_pdf: false até a leitura (pendência P-01).

